# 部署工作流参考文件
# 这份内容需要放到 .github/workflows/deploy.yml 才会生效。
# 由于当前 GitHub Token 没有 workflow 权限，无法直接通过命令行创建，
# 请在 GitHub 网页上手动创建：
#   打开 https://github.com/ugo2000/ai-script-hub/new/master/.github/workflows
#   文件名填 deploy.yml，内容粘贴下面 --- 之间的全部内容，然后 Commit。

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Inject DeepSeek API Key
        run: |
          sed -i "s/YOUR_DEEPSEEK_API_KEY_HERE/${{ secrets.DEEPSEEK_API_KEY }}/g" public/index.html
          sed -i "s/YOUR_DEEPSEEK_API_KEY_HERE/${{ secrets.DEEPSEEK_API_KEY }}/g" public/supabase.js
        shell: bash
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
